name: Test

on:
  workflow_call:
    inputs:
      database-image:
        type: string
        required: true
      database-url:
        type: string
        required: true
      database-port:
        type: string
        required: true
      database-versions:
        type: string
        required: true
      database-env:
        type: string
        required: true
      database-health-cmd:
        type: string
        required: true
      database-version-codecov:
        type: string
        required: true
    secrets:
      CODECOV_TOKEN:
        required: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: [ "3.10", "3.11", "3.12", "3.13", "3.14" ]
        django: [ "4.2", "5.2", "6.0", "6.1" ]
        db: ${{ fromJSON(inputs.database-versions) }}
        # ref: https://github.com/jefftriplett/python-github-actions-matrix-demo
        exclude:
          # Django 4.2 is compatible with Python 3.8-3.12
          - python: "3.13"
            django: "4.2"
          - python: "3.14"
            django: "4.2"
          # Django 6.0+ requires Python 3.12+
          - python: "3.10"
            django: "6.0"
          - python: "3.11"
            django: "6.0"
          - python: "3.10"
            django: "6.1"
          - python: "3.11"
            django: "6.1"
        # newest matrix set which will upload to codecov
        include:
          - python: "3.14"
            django: "6.1"
            db: ${{ inputs.database-version-codecov }}
            codecov: "true"
    services:
      db:
        image: ${{ inputs.database-image }}:${{ matrix.db }}
        env: ${{ fromJSON(inputs.database-env) }}
        ports:
          - ${{ inputs.database-port }}/tcp
        options: >-
          --health-cmd "${{ inputs.database-health-cmd }}"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Fetch pip cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-${{ matrix.python }}
      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v6
        with:
          path: /home/runner/.cache/pypoetry/virtualenvs
          key: venv-${{ matrix.python }}-${{ matrix.django }}-${{ hashFiles('**/poetry.lock') }}
      - name: Install Poetry
        run: |
          pipx install --python "$(which python)" poetry==2.3.3
      - name: Install dependencies
        run: |
          poetry install -n
          poetry run pip install -q "django~=${{ matrix.django }}.0"
      - name: Verify package versions
        run: |
          python -V
          poetry show django
      - name: Run tests
        working-directory: ./test_secured_fields
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          DATABASE_URL: ${{ inputs.database-url }}:${{ job.services.db.ports[inputs.database-port] }}/db
        run: |
          poetry run coverage run manage.py test
          poetry run coverage report -m
          poetry run coverage xml
      - name: Upload coverage to Codecov
        if: matrix.codecov == 'true' && github.actor != 'dependabot[bot]'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          name: ${{ inputs.database-image }}
          directory: ./test_secured_fields
          fail_ci_if_error: true
