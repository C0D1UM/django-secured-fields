name: CI

on:
  push:
    branches: [ main ]
    paths:
      - "secured_fields/**/*"
      - "test_secured_fields/**/*"
      - "pyproject.toml"
      - "poetry.lock"
  pull_request:
    branches: [ main ]
    paths:
      - "secured_fields/**/*"
      - "test_secured_fields/**/*"
      - "pyproject.toml"
      - "poetry.lock"
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Fetch pip cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip
      - name: Install dependencies
        run: |
          pip install pylint~=4.0
      - name: Analyzing the code
        run: |
          pylint secured_fields test_secured_fields
  test-pg:
    needs:
      - lint
    uses: c0d1um/django-secured-fields/.github/workflows/test.yml@main
    with:
      database-image: postgres
      database-url: "postgresql://postgres:P%40ssw0rd@localhost"
      database-port: 5432
      database-versions: >-
        [ "14-alpine", "16-alpine", "18-alpine" ]
      database-env: >-
        { "POSTGRES_DB": "db", "POSTGRES_PASSWORD": "P@ssw0rd" }
      database-health-cmd: "pg_isready"
      database-version-codecov: "18-alpine"  # newest
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
  test-mysql:
    needs:
      - lint
    uses: c0d1um/django-secured-fields/.github/workflows/test.yml@main
    with:
      database-image: mysql
      database-url: "mysql://root:P%40ssw0rd@127.0.0.1"
      database-port: 3306
      database-versions: >-
        [ "8.0", "8.4", "9" ]
      database-env: >-
        { "MYSQL_DATABASE": "db", "MYSQL_ROOT_PASSWORD": "P@ssw0rd" }
      database-health-cmd: "mysqladmin ping"
      database-version-codecov: "9"  # newest
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
  test-sqlite:
    needs:
      - lint
    uses: c0d1um/django-secured-fields/.github/workflows/test.yml@main
    with:
      database-image: spaster/alpine-sleep
      database-url: "sqlite:///db.sqlite3"
      database-port: 80
      database-versions: >-
        [ "latest" ]
      database-env: "{}"
      database-health-cmd: "true"
      database-version-codecov: "latest"  # newest
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
